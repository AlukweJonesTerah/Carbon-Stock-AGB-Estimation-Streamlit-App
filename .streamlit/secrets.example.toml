[ai]
# Create a new Gemini key. Never commit a real key to this file.
gemini_api_key = "paste-a-new-key-here"

[gee]
# The Google Cloud project registered for Earth Engine.
project_id = "your-project-id"

# Paste the complete contents of a service-account JSON key only in
# Streamlit Cloud Secrets or a local, gitignored .streamlit/secrets.toml file.
# Never commit a real private key to this example file.
credentials = '''
{
  "type": "service_account",
  "project_id": "your-project-id",
  "private_key_id": "...",
  "private_key": "-----BEGIN PRIVATE KEY-----\\n...\\n-----END PRIVATE KEY-----\\n",
  "client_email": "your-service-account@your-project.iam.gserviceaccount.com",
  "client_id": "...",
  "auth_uri": "https://accounts.google.com/o/oauth2/auth",
  "token_uri": "https://oauth2.googleapis.com/token",
  "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
  "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/your-service-account%40your-project.iam.gserviceaccount.com",
  "universe_domain": "googleapis.com"
}
'''

[theme]
base = "light"
primaryColor = "#e63946"
backgroundColor = "#f4faf5"
secondaryBackgroundColor = "#eaf6ec"
textColor = "#1c2826"
font = "sans serif"
